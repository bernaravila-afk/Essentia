<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projeto — Etapas 1 a 4</title>
</head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e8eaf6;min-height:100vh;">

  <!-- ───────────────────────────── HEADER ───────────────────────────── -->
  <header style="width:100%;background:linear-gradient(135deg,#1a1d2e 0%,#23263a 100%);box-shadow:0 2px 24px #0008;position:sticky;top:0;z-index:999;">
    <div style="max-width:1100px;margin:0 auto;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;height:64px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;background:linear-gradient(135deg,#6c63ff,#48cfad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;letter-spacing:-1px;">P</div>
        <span style="font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.5px;">ProjetoFlow</span>
      </div>
      <nav style="display:flex;gap:8px;">
        <button onclick="scrollToStep(1)" style="background:none;border:none;color:#a0a3b1;cursor:pointer;font-size:.9rem;padding:6px 14px;border-radius:20px;transition:background .2s;" onmouseover="this.style.background='#ffffff14'" onmouseout="this.style.background='none'">Etapa 1</button>
        <button onclick="scrollToStep(2)" style="background:none;border:none;color:#a0a3b1;cursor:pointer;font-size:.9rem;padding:6px 14px;border-radius:20px;" onmouseover="this.style.background='#ffffff14'" onmouseout="this.style.background='none'">Etapa 2</button>
        <button onclick="scrollToStep(3)" style="background:none;border:none;color:#a0a3b1;cursor:pointer;font-size:.9rem;padding:6px 14px;border-radius:20px;" onmouseover="this.style.background='#ffffff14'" onmouseout="this.style.background='none'">Etapa 3</button>
        <button onclick="scrollToStep(4)" style="background:none;border:none;color:#a0a3b1;cursor:pointer;font-size:.9rem;padding:6px 14px;border-radius:20px;" onmouseover="this.style.background='#ffffff14'" onmouseout="this.style.background='none'">Etapa 4</button>
      </nav>
    </div>
  </header>

  <!-- ───────────────────────────── HERO ───────────────────────────── -->
  <section style="width:100%;background:linear-gradient(160deg,#1a1d2e 60%,#23263a 100%);padding:80px 4vw 60px;text-align:center;">
    <div style="max-width:720px;margin:0 auto;">
      <div style="display:inline-block;background:linear-gradient(90deg,#6c63ff22,#48cfad22);border:1px solid #6c63ff55;color:#9d97ff;font-size:.8rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:6px 18px;border-radius:30px;margin-bottom:24px;">Versão 1.0 — Agente 1</div>
      <h1 style="font-size:clamp(2rem,5vw,3.2rem);font-weight:900;line-height:1.15;margin:0 0 20px;background:linear-gradient(90deg,#fff 30%,#9d97ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
        Escopo das<br/>Etapas 1 a 4
      </h1>
      <p style="font-size:clamp(.95rem,2.5vw,1.15rem);color:#8c8fa8;line-height:1.7;margin:0 0 40px;">
        Primeiro ciclo de desenvolvimento — estruturação, configuração,<br/>implementação inicial e validação do fluxo base.
      </p>
      <!-- Barra de progresso geral -->
      <div style="background:#1e2235;border-radius:12px;padding:20px 28px;display:inline-flex;gap:32px;flex-wrap:wrap;justify-content:center;border:1px solid #ffffff0d;">
        <div style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:900;color:#6c63ff;">4</div>
          <div style="font-size:.75rem;color:#6b6e85;text-transform:uppercase;letter-spacing:1px;">Etapas</div>
        </div>
        <div style="width:1px;background:#ffffff0d;"></div>
        <div style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:900;color:#48cfad;" id="totalTarefas">0</div>
          <div style="font-size:.75rem;color:#6b6e85;text-transform:uppercase;letter-spacing:1px;">Tarefas</div>
        </div>
        <div style="width:1px;background:#ffffff0d;"></div>
        <div style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:900;color:#ffd166;" id="totalConcluidas">0</div>
          <div style="font-size:.75rem;color:#6b6e85;text-transform:uppercase;letter-spacing:1px;">Concluídas</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ───────────────────────── LINHA DO TEMPO ───────────────────────── -->
  <section style="max-width:1100px;margin:0 auto;padding:60px 4vw 40px;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:48px;">
      <h2 style="margin:0;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:800;color:#fff;">Linha do Tempo</h2>
      <div style="flex:1;height:1px;background:linear-gradient(90deg,#6c63ff44,transparent);"></div>
    </div>
    <!-- Timeline horizontal (desktop) / vertical (mobile) -->
    <div style="display:flex;flex-wrap:wrap;gap:0;justify-content:center;" id="timelineContainer">
      <!-- gerado via JS -->
    </div>
  </section>

  <!-- ───────────────────────── CARDS DAS ETAPAS ───────────────────────── -->
  <section style="max-width:1100px;margin:0 auto;padding:20px 4vw 80px;" id="stepsSection">
    <!-- gerado via JS -->
  </section>

  <!-- ───────────────── FOOTER ───────────────── -->
  <footer style="background:#12141f;border-top:1px solid #ffffff08;padding:32px 4vw;text-align:center;">
    <p style="margin:0;font-size:.82rem;color:#3d3f52;">
      ProjetoFlow · Agente 1 · Versão inicial — Etapas 1 a 4 · 
      <span id="footerDate"></span>
    </p>
  </footer>

<!-- ═══════════════════════════ JAVASCRIPT ═══════════════════════════ -->
<script>
/* ─────────── DADOS DAS ETAPAS (substituir pelo JSON real) ─────────── */
const etapas = [
  {
    id: 1,
    titulo: "Levantamento de Requisitos",
    descricao: "Identificar, documentar e validar todos os requisitos funcionais e não funcionais do projeto junto aos stakeholders.",
    icone: "📋",
    cor: "#6c63ff",
    corClara: "#6c63ff22",
    status: "concluida",
    prazo: "Semana 1–2",
    responsavel: "Product Owner + Time",
    tarefas: [
      { id: "1a", texto: "Reunião de kickoff com stakeholders", concluida: true },
      { id: "1b", texto: "Mapeamento de personas e jornadas", concluida: true },
      { id: "1c", texto: "Documentação dos requisitos funcionais", concluida: true },
      { id: "1d", texto: "Documentação dos requisitos não funcionais", concluida: true },
      { id: "1e", texto: "Validação e aprovação do escopo", concluida: true }
    ],
    entregaveis: ["Documento de Requisitos (BRD)", "Mapa de Stakeholders", "Backlog inicial"]
  },
  {
    id: 2,
    titulo: "Arquitetura & Configuração",
    descricao: "Definir a arquitetura técnica, configurar os ambientes de desenvolvimento, homologação e produção.",
    icone: "🏗️",
    cor: "#48cfad",
    corClara: "#48cfad22",
    status: "em_andamento",
    prazo: "Semana 3–4",
    responsavel: "Tech Lead + DevOps",
    tarefas: [
      { id: "2a", texto: "Definição da stack tecnológica", concluida: true },
      { id: "2b", texto: "Desenho da arquitetura de sistema", concluida: true },
      { id: "2c", texto: "Configuração do repositório e CI/CD", concluida: false },
      { id: "2d", texto: "Setup dos ambientes (dev/hom/prod)", concluida: false },
      { id: "2e", texto: "Definição de padrões de código e code review", concluida: false }
    ],
    entregaveis: ["Diagrama de Arquitetura", "Pipeline CI/CD", "Ambientes configurados"]
  },
  {
    id: 3,
    titulo: "Implementação do Núcleo",
    descricao: "Desenvolver as funcionalidades centrais do sistema: autenticação, módulo base e APIs essenciais.",
    icone: "⚙️",
    cor: "#ffd166",
    corClara: "#ffd16622",
    status: "pendente",
    prazo: "Semana 5–8",
    responsavel: "Time de Desenvolvimento",
    tarefas: [
      { id: "3a", texto: "Módulo de autenticação e autorização", concluida: false },
      { id: "3b", texto: "Modelagem e criação do banco de dados", concluida: false },
      { id: "3c", texto: "Desenvolvimento das APIs REST core", concluida: false },
      { id: "3d", texto: "Interface base (layout e navegação)", concluida: false },
      { id: "3e", texto: "Integração front-end ↔ back-end", concluida: false },
      { id: "3f", texto: "Testes unitários do núcleo", concluida: false }
    ],
    entregaveis: ["API documentada (Swagger)", "Banco modelado", "UI base funcional"]
  },
  {
    id: 4,
    titulo: "Validação & Revisão",
    descricao: "Executar testes integrados, coletar feedback dos usuários-piloto e revisar o produto antes da entrega da fase.",
    icone: "✅",
    cor: "#ef6c9f",
    corClara: "#ef6c9f22",
    status: "pendente",
    prazo: "Semana 9–10",
    responsavel: "QA + PO + Usuários-piloto",
    tarefas: [
      { id: "4a", texto: "Elaboração do plano de testes", concluida: false },
      { id: "4b", texto: "Execução dos testes de integração", concluida: false },
      { id: "4c", texto: "Sessão de UAT com usuários-piloto", concluida: false },
      { id: "4d", texto: "Correção dos bugs críticos identificados", concluida: false },
      { id: "4e", texto: "Revisão final e aprovação da fase", concluida: false }
    ],
    entregaveis: ["Relatório de Testes", "Log de Bugs resolvidos", "Sign-off da fase"]
  }
];

/* ─────────── UTILITÁRIOS ─────────── */
const statusConfig = {
  concluida:    { label: "Concluída",     bg: "#48cfad22", color: "#48cfad", dot: "#48cfad" },
  em_andamento: { label: "Em andamento",  bg: "#ffd16622", color: "#ffd166", dot: "#ffd166" },
  pendente:     { label: "Pendente",      bg: "#ffffff0d", color: "#6b6e85", dot: "#3d3f52"  }
};

function pct(tarefas) {
  if (!tarefas.length) return 0;
  return Math.round(tarefas.filter(t => t.concluida).length / tarefas.length * 100);
}

function scrollToStep(n) {
  const el = document.getElementById(`step-${n}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ─────────── TIMELINE ─────────── */
function buildTimeline() {
  const container = document.getElementById('timelineContainer');
  container.innerHTML = '';
  etapas.forEach((etapa, idx) => {
    const st = statusConfig[etapa.status];
    const p  = pct(etapa.tarefas);
    const isLast = idx === etapas.length - 1;

    const wrapper = document.createElement('div');
    wrapper.style.cssText = `display:flex;align-items:center;flex:1;min-width:180px;flex-direction:column;position:relative;`;

    // Node
    const node = document.createElement('div');
    node.onclick = () => scrollToStep(etapa.id);
    node.style.cssText = `
      width:64px;height:64px;border-radius:50%;
      background:linear-gradient(135deg,${etapa.cor}44,${etapa.cor}22);
      border:2px solid ${etapa.cor};
      display:flex;align-items:center;justify-content:center;
      font-size:1.6rem;cursor:pointer;
      box-shadow:0 0 20px ${etapa.cor}44;
      transition:transform .2s;position:relative;z-index:2;
    `;
    node.title = `Ir para Etapa ${etapa.id}`;
    node.innerHTML = etapa.icone;
    node.onmouseover = () => { node.style.transform='scale(1.12)'; };
    node.onmouseout  = () => { node.style.transform='scale(1)'; };

    // Label abaixo do node
    const label = document.createElement('div');
    label.style.cssText = `margin-top:12px;text-align:center;`;
    label.innerHTML = `
      <div style="font-size:.72rem;font-weight:700;color:${etapa.cor};text-transform:uppercase;letter-spacing:1px;">Etapa ${etapa.id}</div>
      <div style="font-size:.78rem;color:#c4c6d4;margin-top:2px;max-width:120px;line-height:1.3;">${etapa.titulo}</div>
      <div style="margin-top:6px;display:inline-flex;align-items:center;gap:5px;background:${st.bg};padding:3px 10px;border-radius:20px;">
        <div style="width:6px;height:6px;border-radius:50%;background:${st.dot};"></div>
        <span style="font-size:.68rem;color:${st.color};">${st.label}</span>
      </div>
      <div style="margin-top:6px;font-size:.7rem;color:#6c63ff;font-weight:700;">${p}%</div>
    `;

    wrapper.appendChild(node);
    wrapper.appendChild(label);

    // Conector (linha)
    if (!isLast) {
      const lineWrap = document.createElement('div');
      lineWrap.style.cssText = `display:flex;align-items:flex-start;padding-top:32px;flex:0 0 40px;`;
      const line = document.createElement('div');
      line.style.cssText = `width:40px;height:2px;background:linear-gradient(90deg,${etapa.cor},${etapas[idx+1].cor});margin-top:0;`;
      lineWrap.appendChild(line);

      const row = document.createElement('div');
      row.style.cssText = `display:flex;align-items:flex-start;`;
      row.appendChild(wrapper);
      row.appendChild(lineWrap);
      container.appendChild(row);
    } else {
      container.appendChild(wrapper);
    }
  });
}

/* ─────────── CARDS DAS ETAPAS ─────────── */
function buildSteps() {
  const section = document.getElementById('stepsSection');
  section.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:48px;">
      <h2 style="margin:0;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:800;color:#fff;">Detalhamento das Etapas</h2>
      <div style="flex:1;height:1px;background:linear-gradient(90deg,#6c63ff44,transparent);"></div>
    </div>
  `;

  etapas.forEach(etapa => {
    const st = statusConfig[etapa.status];
    const p  = pct(etapa.tarefas);

    const card = document.createElement('div');
    card.id = `step-${etapa.id}`;
    card.style.cssText = `
      background:#1a1d2e;
      border:1px solid ${etapa.cor}33;
      border-radius:20px;
      margin-bottom:32px;
      overflow:hidden;
      box-shadow:0 4px 32px #00000044;
      transition:box-shadow .3s;
    `;
    card.onmouseover = () => { card.style.boxShadow = `0 8px 48px ${etapa.cor}22`; };
    card.onmouseout  = () => { card.style.boxShadow = '0 4px 32px #00000044'; };

    /* ── CABEÇALHO DO CARD ── */
    const header = document.createElement('div');
    header.style.cssText = `
      background:linear-gradient(135deg,${etapa.cor}18,${etapa.cor}08);
      border-bottom:1px solid ${etapa.cor}22;
      padding:28px 32px;
      display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    `;
    header.innerHTML = `
      <div style="width:56px;height:56px;border-radius:16px;background:${etapa.cor}22;border:1.5px solid ${etapa.cor}55;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;">${etapa.icone}</div>
      <div style="flex:1;min-width:180px;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;">
          <span style="font-size:.72rem;font-weight:700;color:${etapa.cor};text-transform:uppercase;letter-spacing:1.5px;">Etapa ${etapa.id}</span>
          <span style="background:${st.bg};color:${st.color};font-size:.7rem;font-weight:600;padding:3px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;">
            <span style="width:6px;height:6px;border-radius:50%;background:${st.dot};display:inline-block;"></span>
            ${st.label}
          </span>
        </div>
        <h3 style="margin:0 0 4px;font-size:clamp(1.1rem,2.5vw,1.35rem);font-weight:800;color:#fff;">${etapa.titulo}</h3>
        <p style="margin:0;font-size:.88rem;color:#8c8fa8;line-height:1.5;">${etapa.descricao}</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:100px;">
        <div style="font-size:2rem;font-weight:900;color:${etapa.cor};">${p}%</div>
        <div style="font-size:.72rem;color:#6b6e85;">Concluído</div>
        <div style="display:flex;gap:16px;margin-top:4px;">
          <div style="text-align:center;">
            <div style="font-size:.68rem;color:#6b6e85;text-transform:uppercase;letter-spacing:.8px;">Prazo</div>
            <div style="font-size:.8rem;color:#c4c6d4;font-weight:600;">${etapa.prazo}</div>
          </div>
        </div>
      </div>
    `;

    /* ── BARRA DE PROGRESSO ── */
    const progressBar = document.createElement('div');
    progressBar.style.cssText = `height:4px;background:#ffffff0d;`;
    const progressFill = document.createElement('div');
    progressFill.style.cssText = `height:100%;width:0%;background:linear-gradient(90deg,${etapa.cor},${etapa.cor}88);border-radius:0;transition:width 1.2s cubic-bezier(.4,0,.2,1);`;
    progressBar.appendChild(progressFill);

    /* ── CORPO DO CARD ── */
    const body = document.createElement('div');
    body.style.cssText = `padding:28px 32px;display:flex;flex-wrap:wrap;gap:28px;`;

    /* Coluna tarefas */
    const colTarefas = document.createElement('div');
    colTarefas.style.cssText = `flex:1;min-width:260px;`;
    colTarefas.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <span style="font-size:.82rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;">Tarefas</span>
        <span style="font-size:.75rem;color:#6b6e85;">${etapa.tarefas.filter(t=>t.concluida).length} / ${etapa.tarefas.length}</span>
      </div>
    `;
    const listaTarefas = document.createElement('div');
    listaTarefas.style.cssText = `display:flex;flex-direction:column;gap:8px;`;

    etapa.tarefas.forEach(tarefa => {
      const item = document.createElement('div');
      item.id = `tarefa-${tarefa.id}`;
      item.style.cssText = `
        display:flex;align-items:center;gap:12px;
        background:${tarefa.concluida ? etapa.cor+'12' : '#ffffff05'};
        border:1px solid ${tarefa.concluida ? etapa.cor+'33' : '#ffffff08'};
        border-radius:10px;padding:10px 14px;
        cursor:pointer;transition:background .2s,border .2s;
      `;
      item.innerHTML = `
        <div id="check-${tarefa.id}" style="
          width:20px;height:20px;border-radius:6px;flex-shrink:0;
          background:${tarefa.concluida ? etapa.cor : 'transparent'};
          border:2px solid ${tarefa.concluida ? etapa.cor : '#3d3f52'};
          display:flex;align-items:center;justify-content:center;
          transition:all .2s;
        ">${tarefa.concluida ? '<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>
        <span id="txt-${tarefa.id}" style="font-size:.85rem;color:${tarefa.concluida ? '#6b6e85' : '#c4c6d4'};text-decoration:${tarefa.concluida ? 'line-through' : 'none'};line-height:1.4;">${tarefa.texto}</span>
      `;
      item.onclick = () => toggleTarefa(etapa.id, tarefa.id);
      item.onmouseover = () => { item.style.background = etapa.cor+'18'; };
      item.onmouseout  = () => {
        const t = etapas.find(e=>e.id===etapa.id).tarefas.find(t=>t.id===tarefa.id);
        item.style.background = t.concluida ? etapa.cor+'12' : '#ffffff05';
      };
      listaTarefas.appendChild(item);
    });
    colTarefas.appendChild(listaTarefas);

    /* Coluna entregáveis + info */
    const colInfo = document.createElement('div');
    colInfo.style.cssText = `flex:0 0 240px;min-width:200px;display:flex;flex-direction:column;gap:20px;`;
    colInfo.innerHTML = `
      <div>
        <div style="font-size:.82rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Entregáveis</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${etapa.entregaveis.map(e => `
            <div style="display:flex;align-items:center;gap:8px;background:#ffffff05;border:1px solid #ffffff08;border-radius:8px;padding:8px 12px;">
              <span style="color:${etapa.cor};font-size:.9rem;">◆</span>
              <span style="font-size:.82rem;color:#a0a3b1;">${e}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div style="background:#ffffff05;border:1px solid #ffffff08;border-radius:12px;padding:14px;">
        <div style="font-size:.7rem;color:#6b6e85;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;">Responsável</div>
        <div style="font-size:.85rem;color:#c4c6d4;font-weight:600;">${etapa.responsavel}</div>
        <div style="font-size:.7rem;color:#6b6e85;text-transform:uppercase;letter-spacing:.8px;margin-top:12px;margin-bottom:6px;">Período</div>
        <div style="font-size:.85rem;color:#c4c6d4;font-weight:600;">${etapa.prazo}</div>
      </div>
    `;

    body.appendChild(colTarefas);
    body.appendChild(colInfo);

    card.appendChild(header);
    card.appendChild(progressBar);
    card.appendChild(body);
    section.appendChild(card);

    // Anima a barra de progresso após inserção
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        progressFill.style.width = p + '%';
      });
    });
  });
}

/* ─────────── TOGGLE TAREFA ─────────── */
function toggleTarefa(etapaId, tarefaId) {
  const etapa = etapas.find(e => e.id === etapaId);
  if (!etapa) return;
  const tarefa = etapa.tarefas.find(t => t.id === tarefaId);
  if (!tarefa) return;

  tarefa.concluida = !tarefa.concluida;

  const checkEl = document.getElementById(`check-${tarefaId}`);
  const txtEl   = document.getElementById(`txt-${tarefaId}`);
  const item    = document.getElementById(`tarefa-${tarefaId}`);

  if (tarefa.concluida) {
    checkEl.style.background = etapa.cor;
