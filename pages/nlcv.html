function navigate(screen, param) {
  state.currentScreen = screen;
  if (param && screen === 'category') state.selectedCategory = param;
  if (param && screen === 'recipe') state.selectedRecipe = param;
  state.shareModalOpen = false;
  render();

}

// ============================================================
// HELPERS
// ============================================================
function getCategoryById(id) { return DATA.categories.find(c => c.id === id); }
function getRecipeById(id) { return DATA.recipes.find(r => r.id === id); }
function getRecipesByCategory(catId) { return DATA.recipes.filter(r => r.category_id === catId); }
function lightenColor(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0x00FF) + amount);
  const b = Math.min(255, (num & 0x0000FF) + amount);
  return `rgb(${r},${g},${b})`;
}
function encodeForWhatsApp(text) { return encodeURIComponent(text); }
function getYouTubeId(url) {
  const match = url.match(/embed\/([^?]+)/);
  return match ? match[1] : null;
}

// ============================================================
// SHARE FUNCTIONALITY
// ============================================================
function shareRecipe(recipe) {
  const url = `https://app.healthbar.com/receita/${recipe.slug}?utm_source=share&utm_medium=whatsapp`;
  const text = `Confira esta receita incrível: ${recipe.name} — ${recipe.description_short}\n\n`;
  if (navigator.share) {
    navigator.share({ title: recipe.name, text: recipe.description_short, url: url })
      .catch(() => showShareModal(recipe));
  } else { showShareModal(recipe); }
}
function showShareModal(recipe) {
  state.shareModalOpen = true;
  state.selectedRecipe = recipe.id;
  render();
}
function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('Link copiado!'));
  } else {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('Link copiado!');
  }
}
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#2D2D2D;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;';
  document.body.appendChild(t);
  setTimeout(() => t.style.opacity = '1', 10);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

    { id: 'videos', label: 'Vídeos', screen: 'videos', icon: '▶️' }
  ];
  const current = state.currentScreen;
  return `<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:768px;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-top:1px solid #E8E8E4;display:flex;justify-content:space-around;align-items:center;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100;">
    ${items.map(item => {
      const active = (current === item.screen) || (item.screen === 'categories' && (current === 'category' || current === 'recipe'));
      return `<button onclick="navigate('${item.screen}')" aria-label="${item.label}" style="display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;padding:6px 20px;border-radius:12px;transition:all 0.2s;${active ? 'background:#F0FDF4;' : ''}">

      </button>`;
    }).join('')}

}
