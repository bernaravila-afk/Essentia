<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Bar — Cardápio Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #F7F4EF;
      --color-surface: #FFFFFF;
      --color-text: #1C1C1A;
      --color-muted: #7A7A72;
      --color-accent: #4A7C59;
      --smoothie-1: #6BAE8A;
      --smoothie-2: #E8A87C;
      --smoothie-3: #A8C5A0;
      --elixir-1: #C4956A;
      --elixir-2: #8B6FAB;
      --elixir-3: #D4A853;
      --bowl-1: #E07B6A;
      --bowl-2: #5B8DB8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

    /* ── Typography ── */
    .font-serif { font-family: 'DM Serif Display', serif; }

    /* ── Screens ── */
    .screen {
      display: none;
      min-height: 100vh;
      animation: fadeIn 0.4s ease;
    }
    .screen.active { display: flex; flex-direction: column; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Splash ── */
    #screen-splash {
      background: linear-gradient(160deg, #2D5A3D 0%, #4A7C59 50%, #6BAE8A 100%);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    #screen-splash::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      top: -150px; right: -150px;
    }
    #screen-splash::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: -80px; left: -80px;
    }
    .splash-logo {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.15);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .splash-logo svg { width: 44px; height: 44px; }
    .splash-title {
      font-family: 'DM Serif Display', serif;
      font-size: 2.8rem;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }
    .splash-subtitle {
      color: rgba(255,255,255,0.75);
      font-size: 1rem;
      font-weight: 300;
      max-width: 280px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }
    .btn-primary {
      background: #fff;
      color: #2D5A3D;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 2.5rem;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.2); }
    .btn-primary:active { transform: translateY(0); }
    .splash-tagline {
      margin-top: 2rem;
      color: rgba(255,255,255,0.5);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Menu Screen ── */
    #screen-menu {
      background: var(--color-bg);
      padding-bottom: 80px;
    }

    .menu-header {
      padding: 3rem 1.5rem 1rem;
      position: sticky;
      top: 0;
      background: var(--color-bg);
      z-index: 10;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .menu-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .menu-logo-small {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .menu-logo-icon {
      width: 36px; height: 36px;
      background: var(--color-accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .menu-logo-icon svg { width: 20px; height: 20px; }
    .menu-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      color: var(--color-text);
    }
    .menu-date-badge {
      font-size: 0.7rem;
      color: var(--color-muted);
      background: rgba(0,0,0,0.05);
      padding: 0.3rem 0.7rem;
      border-radius: 100px;
    }

    /* Category Pills */
    .category-pills {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .pill.inactive {
      background: transparent;
      border-color: rgba(0,0,0,0.12);
      color: var(--color-muted);
    }
    .pill.active {
      background: var(--color-text);
      color: #fff;
      border-color: var(--color-text);
    }
    .pill:hover:not(.active) {
      border-color: var(--color-text);
      color: var(--color-text);
    }

    /* Category Intro */
    .category-intro {
      margin: 1.25rem 1.5rem 0;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.06);
      display: none;
    }
    .category-intro.visible { display: block; }
    .category-intro-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }
    .category-intro-text {
      font-size: 0.85rem;
      color: var(--color-muted);
      line-height: 1.6;
    }

    /* Recipe Grid */
    .recipe-grid {
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .recipe-card {
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      background: var(--color-surface);
      position: relative;
    }
    .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .recipe-card:active { transform: scale(0.98); }

    .recipe-card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .recipe-card-img-placeholder {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .recipe-card-body {
      padding: 0.75rem;
    }
    .recipe-card-category {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .recipe-card-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }
    .recipe-card-desc {
      font-size: 0.75rem;
      color: var(--color-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .recipe-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .recipe-card-kcal {
      font-size: 0.72rem;
      color: var(--color-muted);
    }
    .recipe-card-time {
      font-size: 0.72rem;
      color: var(--color-muted);
      display: flex; align-items: center; gap: 0.2rem;
    }
    .recipe-card-badge {
      position: absolute;
      top: 0.6rem; left: 0.6rem;
      padding: 0.2rem 0.55rem;
      border-radius: 100px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 1rem;
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      transition: background 0.15s;
      border: none;
      background: transparent;
    }
    .nav-item:hover { background: rgba(0,0,0,0.04); }
    .nav-item.active .nav-icon { color: var(--color-accent); }
    .nav-item.active .nav-label { color: var(--color-accent); font-weight: 600; }
    .nav-icon { font-size: 1.3rem; color: #aaa; transition: color 0.2s; }
    .nav-label { font-size: 0.65rem; color: #aaa; transition: color 0.2s; }

    /* ── Recipe Detail Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open {
      display: flex;
      animation: overlayIn 0.3s ease;
    }
    @keyframes overlayIn {
