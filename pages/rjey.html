<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Bar — Cardápio Digital</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep:   #2D6A4F;
    --green-mid:    #40916C;
    --green-light:  #74C69D;
    --green-pale:   #D8F3DC;
    --elixir-bg:    #FFF3E0;
    --elixir-acc:   #E65100;
    --smoothie-bg:  #F3E5F5;
    --smoothie-acc: #7B1FA2;
    --shot-bg:      #FFF9C4;
    --shot-acc:     #F9A825;
    --cha-bg:       #E8F5E9;
    --cha-acc:      #2E7D32;
    --cream:        #FAFAF7;
    --text-dark:    #1B2E22;
    --text-mid:     #4A6355;
    --text-light:   #8FAF9A;
    --shadow-sm:    0 2px 8px rgba(45,106,79,.10);
    --shadow-md:    0 6px 24px rgba(45,106,79,.16);
    --shadow-lg:    0 16px 48px rgba(45,106,79,.22);
    --radius-sm:    10px;
    --radius-md:    18px;
    --radius-lg:    28px;
    --transition:   .28s cubic-bezier(.4,0,.2,1);
    --font:         'Segoe UI', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    padding-bottom: 80px;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-mid) 100%);
    color: #fff;
    padding: 28px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-md);
  }
  .header-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 40px; height: 40px;
    background: rgba(255,255,255,.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo-text h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .3px; }
  .logo-text p  { font-size: .72rem; opacity: .75; margin-top: 1px; }

  /* Search */
  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 14px auto 0;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: none;
    border-radius: 50px;
    background: rgba(255,255,255,.18);
    color: #fff;
    font-size: .88rem;
    outline: none;
    backdrop-filter: blur(6px);
    transition: var(--transition);
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,.65); }
  .search-wrap input:focus { background: rgba(255,255,255,.28); }
  .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px; opacity: .7;
  }

  /* ── Category Pills ── */
  .cat-scroll {
    max-width: 480px;
    margin: 18px auto 0;
    display: flex;
    gap: 10px;
    padding: 0 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .cat-pill {
    flex-shrink: 0;
    padding: 8px 18px;
    border-radius: 50px;
    border: 2px solid transparent;
    background: #fff;
    color: var(--text-mid);
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; gap: 6px;
  }
  .cat-pill.active, .cat-pill:hover {
    background: var(--green-deep);
    color: #fff;
    border-color: var(--green-deep);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  /* ── Category Hero Banner ── */
  .cat-banner {
    max-width: 480px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: none;
  }
  .cat-banner.visible { display: block; }
  .cat-banner-inner {
    border-radius: var(--radius-md);
    padding: 20px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .cat-banner-icon { font-size: 2.4rem; flex-shrink: 0; }
  .cat-banner-text h2 { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .cat-banner-text p  { font-size: .8rem; line-height: 1.55; opacity: .85; }

  /* ── Section Title ── */
  .section-title {
    max-width: 480px;
    margin: 24px auto 0;
    padding: 0 20px;
    font-size: .78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-light);
  }

  /* ── Recipe Grid ── */
  .grid {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* ── Recipe Card ── */
  .card {
    background: #fff;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: var(--transition);
    position: relative;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }
  .card:active { transform: scale(.97); }

  .card-img {
    width: 100%; height: 120px;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    position: relative;
    overflow: hidden;
  }
  .card-img::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.12) 100%);
  }
  .card-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,255,255,.9);
    border-radius: 50px;
    padding: 2px 8px;
    font-size: .65rem;
    font-weight: 700;
    color: var(--text-dark);
    backdrop-filter: blur(4px);
    z-index: 1;
  }
  .card-body { padding: 12px; }
  .card-name { font-size: .88rem; font-weight: 700; line-height: 1.3; }
  .card-desc { font-size: .72rem; color: var(--text-light); margin-top: 4px; line-height: 1.4; }
  .card-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
  }
  .card-kcal { font-size: .7rem; color: var(--text-mid); font-weight: 600; }
  .card-time {
    font-size: .68rem; color: var(--text-light);
    display: flex; align-items: center; gap: 3px;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(27,46,34,.55);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    width: 100%; max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    max-height: 92vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    scrollbar-width: none;
  }
  .modal::-webkit-scrollbar { display: none; }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-drag {
    width: 40px; height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-hero {
    width: 100%; height: 200px;
    display: flex; align-items: center; justify-content: center;
    font-size: 5rem;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    width: 34px; height: 34px;
    background: rgba(255,255,255,.85);
    border: none; border-radius: 50%;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    transition: var(--transition);
    z-index: 2;
  }
  .modal-close:hover { background: #fff; transform: scale(1.1); }

  .modal-body { padding: 20px; }
  .modal-cat-tag {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 50px;
    font-size: .7rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .modal-title { font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
  .modal-subtitle { font-size: .82rem; color: var(--text-mid); margin-top: 4px; line-height: 1.5; }

  .modal-stats {
    display: flex; gap: 10px;
    margin: 16px 0;
  }
  .stat-pill {
    flex: 1;
    background: var(--green-pale);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    text-align: center;
  }
  .stat-pill .val { font-size: .95rem; font-weight: 800; color: var(--green-deep); }
  .stat-pill .lbl { font-size: .62rem; color: var(--text-mid); margin-top: 2px; text-transform: uppercase; letter-spacing: .6px; }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--green-pale);
    margin-bottom: 18px;
    gap: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 4px;
    border: none; background: none;
    font-size: .78rem; font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: var(--transition);
  }
  .tab-btn.active {
    color: var(--green-deep);
    border-bottom-color: var(--green-deep);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Prep Steps */
  .prep-step {
    display: flex; gap: 14px;
    margin-bottom: 16px;
    align-items: flex-start;
  }
  .step-num {
    flex-shrink: 0;
    width: 28px; height: 28px;
    background: var(--green-deep);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 800;
  }
  .step-text { font-size: .82rem; line-height: 1.6; color: var(--text-mid); padding-top: 4px; }

  /* Nutrition Table */
  .nut-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .nut-table th {
    text-align: left; padding: 8px 10px;
    background: var(--green-pale);
    color: var(--green-deep);
    font-weight: 700; font-size: .72rem;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .nut-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; color: var(--text-mid); }
